# Repo-wide ruff config (exporter/ has its own in pyproject.toml, which takes precedence there).
line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "I", "B", "UP", "W"]

[lint.per-file-ignores]
# Dashboard builder is a table of panel definitions; long lines read better than wrapped ones.
"grafana/build_dashboard.py" = ["E501"]
# The code scanner's API patterns are a table of regexes; splitting them hides what each one matches.
"keycensus/collectors/code.py" = ["E501"]
"tests/test_code.py" = ["E501"]
"tests/test_trust.py" = ["E501"]
