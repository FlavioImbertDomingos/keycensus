# ------------------------------------------------------------------
#  keycensus demo stack
#
#      docker compose up -d
#
#  then open
#      Report        http://localhost:9742/report.html
#      CBOM          http://localhost:9742/cbom.json
#      Metrics       http://localhost:9742/metrics
#      Vault UI      http://localhost:8200   (token: root)
#      KMS mock      http://localhost:5050   (moto; container port stays 5000)
#
#  Every published port is overridable, so a port already taken on your machine
#  is a one-line fix -- copy .env.example to .env and change it, e.g.
#      KMS_PORT=5051 VAULT_PORT=8201 docker compose up -d
#  Only the host side moves; container ports and service URLs never change.
#
#  Optional monitoring (Prometheus + Grafana):
#      docker compose --profile monitoring up -d
#      Grafana       http://localhost:3000   (admin / admin)
#
#  The two keycensus images are BUILT from this checkout (pull_policy: build), so
#  Compose never contacts a registry for them. Released images are published to
#  ghcr.io/flavioimbertdomingos/keycensus by CI.
#
#  Sources in the demo: a real Vault, a SoftHSM token (real PKCS#11),
#  a faithful AWS KMS mock (moto, real boto3), a mock Voltage export,
#  a folder of imperfect PEM files, and one TLS endpoint.
# ------------------------------------------------------------------

services:

  keycensus:
    build: .
    image: keycensus-demo:local
    pull_policy: build          # built from this checkout -- never look for it in a registry
    container_name: keycensus
    environment:
      KEYCENSUS_DEMO: "1"                    # seed SoftHSM + KMS + certs on start
      KEYCENSUS_CONFIG: /config/keycensus.yml
      KEYCENSUS_INTERVAL: ${KEYCENSUS_INTERVAL:-2m}
      HSM_PIN: ${HSM_PIN:-1234}
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
      VOLTAGE_PASSWORD: ${VOLTAGE_PASSWORD:-changeme}
      # Export KEYCENSUS_WEBHOOK_URL and uncomment `notifications:` in
      # config/keycensus.demo.yml to have the demo post page-worthy changes.
      KEYCENSUS_WEBHOOK_URL: ${KEYCENSUS_WEBHOOK_URL:-}
      KMS_ENDPOINT: http://kms:5000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./config/keycensus.demo.yml:/config/keycensus.yml:ro
      - keycensus-out:/out
    ports:
      - "${KEYCENSUS_PORT:-9742}:9742"
    depends_on:
      vault-seed:
        condition: service_completed_successfully
      kms:
        condition: service_started
      voltage:
        condition: service_healthy
    restart: unless-stopped

  # A real Vault, in dev mode (in-memory, unsealed, root token "root").
  vault:
    image: hashicorp/vault:1.18
    container_name: vault
    cap_add: ["IPC_LOCK"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "${VAULT_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Seeds Vault with Transit keys and a PKI mount, then exits.
  vault-seed:
    image: hashicorp/vault:1.18
    container_name: vault-seed
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
    volumes:
      - ./demo/seed_vault.sh:/seed.sh:ro
    entrypoint: ["/bin/sh", "/seed.sh"]
    depends_on:
      vault:
        condition: service_healthy

  # moto: an AWS API mock good enough that real boto3 code doesn't know the difference.
  kms:
    image: motoserver/moto:5.0.28
    container_name: kms
    ports:
      - "${KMS_PORT:-5050}:5000"      # host 5050: macOS AirPlay Receiver owns 5000

  # Pretend Voltage SecureData export (HTTP :8800) + an HTTPS port to scan (:8443).
  voltage:
    build: ./mock-voltage
    image: keycensus-mock-voltage:local
    pull_policy: build          # ditto
    container_name: voltage
    environment:
      MOCK_USERNAME: monitor
      MOCK_PASSWORD: ${VOLTAGE_PASSWORD:-changeme}
      MOCK_TLS_CERT_DAYS: "20"
    ports:
      - "${VOLTAGE_PORT:-8800}:8800"
      - "${VOLTAGE_TLS_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8800/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---------------- optional: --profile monitoring ----------------
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    profiles: ["monitoring"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on: [keycensus]

  grafana:
    image: grafana/grafana:12.1.0
    container_name: grafana
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/keycensus.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus]

volumes:
  keycensus-out:
