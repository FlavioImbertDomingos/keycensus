# keycensus configuration -- copy to config/keycensus.yml and edit.
# Secrets are referenced by env var (`*_env`), file (`*_file`) or a secret store
# (`*_vault`, `*_aws_secret`, `*_azure_secret`, `*_gcp_secret`); never inline.

policy: default                       # or: /config/my-policy.yml

# ---- Where *_vault / *_aws_secret / ... references are fetched from (docs/PERMISSIONS.md)
# secrets:
#   vault: {url: https://vault.example.com:8200, auth: kubernetes, role: keycensus}
#   aws: {region: us-east-1}

# ---- keycensus serve: the report and CBOM need a token (docs/PERMISSIONS.md)
serve:
  listen: 127.0.0.1                   # anything else needs a token or allow_unauthenticated: true
  port: 9742
  auth:
    tokens:
      - {name: grafana, token_env: KC_TOKEN_GRAFANA}
      # - {name: auditor, token_vault: secret/data/keycensus#auditor_token}
    # public_paths: [/metrics, /healthz, /livez]   # the default
    # oidc:                            # sign in through your identity provider (docs/PERMISSIONS.md)
    #   issuer: https://login.microsoftonline.com/<tenant-id>/v2.0
    #   client_id: <application-id>
    #   client_secret_env: KC_OIDC_SECRET
    #   redirect_url: https://keycensus.example.com/oauth2/callback
    #   allowed_groups: [<group-object-id>]
    #   session_key_env: KC_SESSION_KEY
  # tls: {cert_file: /etc/keycensus/tls.crt, key_file: /etc/keycensus/tls.key}

# ---- Hash-chained audit log: scans, config changes, report reads, webhooks (SECURITY.md)
# audit:
#   path: /var/log/keycensus/audit.jsonl
#   hmac_key_env: KEYCENSUS_AUDIT_KEY

# ---- Signed scan records: manifest.json + Ed25519 signature next to the outputs
#      (keycensus keygen --out keycensus-signing; keycensus verify out --public-key ...)
# signing:
#   private_key_file: /run/secrets/keycensus-signing.pem
#   timestamp:                         # RFC 3161: a TSA vouches for when the scan was signed
#     urls: [http://timestamp.digicert.com, https://freetsa.org/tsr]
#     ca_file: /etc/ssl/certs/ca-certificates.crt
#     required: false

sources:
  # ---- HSMs over PKCS#11 (run keycensus where the vendor client library is installed)
  - name: luna-payments
    type: pkcs11
    module: /usr/safenet/lunaclient/lib/libCryptoki2_64.so
    token_label: payments-partition
    pin_env: LUNA_PIN_PAYMENTS
    hardware_backed: true
    fips_validated: true
    tags: {site: phx-dc1, owner: crypto-team}

  # - name: nshield
  #   type: pkcs11
  #   module: /opt/nfast/toolkits/pkcs11/libcknfast.so
  #   slot: 0
  #   pin_env: NSHIELD_PIN
  #   hardware_backed: true

  # ---- HashiCorp Vault
  - name: vault-prod
    type: vault
    url: https://vault.example.com:8200
    token_env: VAULT_TOKEN
    # namespace: payments
    # transit_mounts: [transit]
    # pki_mounts: [pki_int]
    verify_tls: /config/corp-ca.pem
    hardware_backed: false            # true if using Managed Keys / HSM seal for transit

  # ---- AWS KMS
  - name: aws-prod
    type: aws-kms
    region: us-east-1
    # profile: prod
    include_aws_managed: false
    # Discovery instead of one account and region (run from the management account):
    # organization: true             # every ACTIVE account; assumes member_role in each
    # member_role: KeycensusReadOnly
    # regions: all                   # every region enabled in each account

  # ---- Azure Key Vault (or Managed HSM: https://<name>.managedhsm.azure.net)
  - name: kv-payments
    type: azure-keyvault
    vault_url: https://payments-kv.vault.azure.net
    auth: default                    # DefaultAzureCredential; or auth: token + token_env: AZURE_TOKEN
    include_certificates: true
    # Discovery: drop vault_url and set discover: true for every vault in every subscription
    # discover: true
    # subscriptions: [00000000-0000-0000-0000-000000000000]

  # ---- Google Cloud KMS
  - name: gcp-payments
    type: gcp-kms
    project: acme-payments-prod
    # locations: [global, us-east1]  # default: all
    auth: default                    # Application Default Credentials; or auth: token + token_env: GCP_TOKEN
    # Discovery: drop project and set discover: true for every project you can see
    # discover: true
    # project_query: "parent:folders/123456789"

  # ---- Thales CipherTrust Manager (REST)
  - name: ctm-prod
    type: ciphertrust
    url: https://ctm.example.com
    username: keycensus
    password_env: CTM_PASSWORD
    # password_vault: secret/data/keycensus#ctm_password   # or from a secret store
    # domain: payments
    hardware_backed: true            # HSM-anchored domain

  # ---- Entrust KeySafe 5 (nShield estate, REST)
  - name: nshield-estate
    type: keysafe5
    url: https://keysafe5.example.com
    auth: bearer
    token_env: KS5_TOKEN

  # ---- Voltage SecureData (inventory export)
  - name: voltage
    type: voltage
    file: /exports/voltage-keys.csv
    # url: https://export.internal/voltage/inventory.json
    # username: monitor
    # password_env: VOLTAGE_PASSWORD
    hardware_backed: true
    # field_map: {name: KeyName, identity: Identity, district: District, algorithm: Algorithm,
    #             created: CreatedDate, rotated: LastRotation, state: Status}

  # ---- Microsoft AD CS (CAs and templates over LDAP, issued certificates from certutil exports)
  - name: corp-pki
    type: adcs
    ldap_url: ldaps://dc01.corp.example.com
    username: svc-keycensus@corp.example.com
    password_env: ADCS_LDAP_PASSWORD
    # auth: kerberos                   # instead of username/password; run kinit first
    # verify_tls: /config/corp-root-ca.pem
    exports:                           # certutil -view ... csv, one file per CA
      - /exports/corp-issuing-ca1.csv
    # include_expired: false
    # include_revoked: false
    # ca_hardware_backed: true         # CA keys are in an HSM (LDAP cannot tell)

  # ---- Files on disk: PEM/DER, PKCS#12, JKS/JCEKS, SSH keys, authorized_keys, known_hosts, SSH certificates
  - name: app-certs
    type: files                      # `pem` also works
    paths: [/etc/ssl/app, /opt/payments/keys, /etc/ssh]
    # keystore_passwords:            # tried on keystores and encrypted PEM keys, then the well-known ones
    #   - password_env: APP_KEYSTORE_PASSWORD

  # ---- Live TLS endpoints
  - name: edges
    type: tls
    endpoints: ["api.example.com:443", "hsm-proxy.internal:8443", "ldap://dc01.corp.example.com"]  # ldap:// = StartTLS
    probe_legacy: true
    probe_pqc: true                  # TLS 1.3 key exchange: classical, hybrid (X25519MLKEM768) or ML-KEM

  # ---- SSH servers (banner and offered algorithms; no login)
  - name: bastions
    type: ssh
    endpoints: ["bastion.example.com", "10.0.0.7:2222"]

  # ---- Network discovery: TLS, LDAP (StartTLS on 389, LDAPS) and SSH endpoints nobody listed.
  #      Scan only what you may scan.
  - name: dc-east
    type: network
    cidrs: [10.20.0.0/22]
    # exclude: [10.20.1.0/28]
    # ports: {443: tls, 8443: tls, 389: ldap-starttls, 636: ldaps, 3269: ldaps, 22: ssh}   # the default
    # max_hosts: 4096                # larger ranges are refused unless raised
    # allow_public: false            # public addresses are refused unless set

  # ---- Kubernetes: TLS and Opaque secrets (keys, certificates, keystores), cert-manager, consumers
  #      pip install "keycensus[kubernetes]"; RBAC in deploy/kubernetes/keycensus-reader.yaml
  # - name: prod-cluster
  #   type: kubernetes
  #   context: prod                  # default: in-cluster service account, else $KUBECONFIG
  #   namespaces: []                 # default: all

  # ---- Certificate Transparency: every public certificate issued for your domains
  # - name: public-certs
  #   type: ct
  #   domains: [example.com]
  #   expected_issuers: ["Let's Encrypt", "DigiCert"]   # anything else is a finding
  #   api_key_env: CERTSPOTTER_API_KEY                  # optional

  # ---- Source code: hard-coded private keys and keystores, crypto API calls
  # - name: payments-repo
  #   type: code
  #   paths: [/src/payments-api]
  #   exclude: ["docs/**"]
