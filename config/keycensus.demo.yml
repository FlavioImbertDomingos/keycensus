# Demo configuration used by docker-compose.yml. Every source here is fake or local:
#   softhsm      a software PKCS#11 token inside the keycensus container (real PKCS#11 code path)
#   vault        a real HashiCorp Vault dev server (container)
#   fake-aws     moto, a faithful AWS API mock (real boto3 code path)
#   voltage      mock export in the canonical Voltage shape
#   app-certs    a folder of deliberately imperfect PEM files
#   edges        the mock's HTTPS port, scanned like any TLS endpoint
policy: default

sources:
  - name: softhsm
    type: pkcs11
    module: /usr/lib/softhsm/libsofthsm2.so
    token_label: demo
    pin_env: HSM_PIN
    hardware_backed: false      # it's software; a real Luna/nShield would be true
    tags: {env: demo, owner: crypto-team}

  - name: vault
    type: vault
    url: http://vault:8200
    token_env: VAULT_TOKEN
    hardware_backed: false

  - name: fake-aws
    type: aws-kms
    region: us-east-1
    endpoint_url: http://kms:5000
    include_aws_managed: false

  - name: voltage
    type: voltage
    url: http://voltage:8800/inventory.json
    username: monitor
    password_env: VOLTAGE_PASSWORD

  - name: app-certs
    type: pem
    paths: [/app/demo/certs]

  - name: edges
    type: tls
    endpoints: ["voltage:8443"]
    probe_legacy: true

# ---- SBOM <-> CBOM linking: which application uses which key.
# Each application is backed by a CycloneDX SBOM (name/version/purl from metadata.component) and a
# few selectors. Automatic matching also links assets whose inferred consumers (KMS grants, Vault
# policies) mention the application name -- see docs/LINKING.md.
applications:
  - sbom: /app/demo/sboms/payments-api.cdx.json
    owner: payments-team
    uses:
      - {source: softhsm, name: "payments-*"}
      - {source: fake-aws, tag: {app: payments}}
      - {source: voltage, name: "pan-*"}
      - {kind: certificate, name: "vault-app.demo.bank"}
  - sbom: /app/demo/sboms/auth-service.cdx.json
    uses:
      - {source: softhsm, name: "signing-*"}
      - {source: fake-aws, tag: {app: auth}}
  # The third application ships an SPDX SBOM rather than CycloneDX, so the demo
  # exercises both readers. Identity comes from the package the document
  # DESCRIBES, not from the document name.
  - sbom: /app/demo/sboms/batch-reporting.spdx.json
    uses:
      - {source: fake-aws, name: legacy-cmk}
      - {principal: "*batch*"}

# ---------------------------------------------------------------------------
#  Alerting on change (docs/ALERTING.md)
#
#  Every rescan is diffed against the previous one and each change is classified
#  into a kind with an urgency: page / digest / ignore. `serve` exports
#  keycensus_change_total{kind,urgency,source} and publishes /changes.json.
#
#  Uncomment to have the demo POST page-worthy changes to a webhook. The URL is
#  read from the environment because a webhook URL is a credential -- keycensus
#  refuses a `webhook_url:` key outright.
#
#    export KEYCENSUS_WEBHOOK_URL='https://hooks.slack.com/services/...'
#
# notifications:
#   webhook_url_env: KEYCENSUS_WEBHOOK_URL
#   format: slack            # generic | slack | teams
#   on: page                 # page (default) | any | never
#   include_digest: true

# The shipped urgency table is an opinion; re-map any kind for your estate.
# `keycensus changes --kinds` prints the whole vocabulary.
#
# changes:
#   urgency:
#     consumer-added: page          # a new principal on a payment key IS a page here
#     certificate-replaced: ignore  # we rotate these hourly
