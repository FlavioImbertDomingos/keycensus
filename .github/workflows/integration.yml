name: Live integration (Azure / GCP)

# Runs the collectors against real cloud accounts. Nothing here uses a long-lived secret: both clouds
# trust GitHub's OIDC token for this repository (workload identity federation), and the only inputs are
# repository *variables* (Settings > Secrets and variables > Actions > Variables):
#
#   Azure: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, KEYCENSUS_IT_AZURE_VAULT_URL
#   GCP:   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT, KEYCENSUS_IT_GCP_PROJECT, KEYCENSUS_IT_GCP_LOCATION
#
# A job is skipped (not failed) while its variables are unset, so forks and fresh clones stay green.
# Setup: docs/INTEGRATION-TESTS.md. Fixtures: tests/integration/bootstrap-*.sh.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"          # Mondays 05:17 UTC
  push:
    branches: [main]
    paths:
      - "keycensus/collectors/azure_keyvault.py"
      - "keycensus/collectors/gcp_kms.py"
      - "tests/integration/**"
      - ".github/workflows/integration.yml"

permissions:
  contents: read

jobs:
  azure:
    name: Azure Key Vault (live)
    if: vars.KEYCENSUS_IT_AZURE_VAULT_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write             # OIDC token for the cloud login
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[test,azure]"
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Live tests
        run: python -m pytest -q tests/integration/test_azure_live.py -rs
        env:
          KEYCENSUS_IT_AZURE_VAULT_URL: ${{ vars.KEYCENSUS_IT_AZURE_VAULT_URL }}
          KEYCENSUS_IT_FIXTURES: ${{ vars.KEYCENSUS_IT_FIXTURES || '1' }}
      - name: Full scan artifact (report + CBOM of the fixture vault)
        run: |
          cat > it.yml <<EOF
          sources:
            - name: azure-it
              type: azure-keyvault
              vault_url: ${{ vars.KEYCENSUS_IT_AZURE_VAULT_URL }}
          EOF
          keycensus scan -c it.yml -o out-azure || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: azure-live-scan
          path: out-azure/

  gcp:
    name: Google Cloud KMS (live)
    if: vars.KEYCENSUS_IT_GCP_PROJECT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write             # OIDC token for the cloud login
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[test,gcp]"
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Live tests
        run: python -m pytest -q tests/integration/test_gcp_live.py -rs
        env:
          KEYCENSUS_IT_GCP_PROJECT: ${{ vars.KEYCENSUS_IT_GCP_PROJECT }}
          KEYCENSUS_IT_GCP_LOCATION: ${{ vars.KEYCENSUS_IT_GCP_LOCATION }}
          KEYCENSUS_IT_FIXTURES: ${{ vars.KEYCENSUS_IT_FIXTURES || '1' }}
      - name: Full scan artifact
        run: |
          cat > it.yml <<EOF
          sources:
            - name: gcp-it
              type: gcp-kms
              project: ${{ vars.KEYCENSUS_IT_GCP_PROJECT }}
          EOF
          keycensus scan -c it.yml -o out-gcp || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gcp-live-scan
          path: out-gcp/

