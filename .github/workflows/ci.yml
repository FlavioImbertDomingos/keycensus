name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default. Only the job that pushes to GHCR gets packages: write.
permissions:
  contents: read

jobs:
  test:
    name: Lint + tests (SoftHSM, moto, live TLS)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: System deps (SoftHSM for the PKCS#11 tests, slapd for LDAP StartTLS)
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q softhsm2 slapd
          # Ubuntu's AppArmor profile confines slapd to /etc/ldap and /var/lib/ldap; the tests run it from a temp dir
          if [ -f /etc/apparmor.d/usr.sbin.slapd ]; then sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.slapd || true; fi
      - name: Install
        run: |
          pip install ruff
          pip install -e ".[test]"
      - name: Ruff
        run: |
          ruff check keycensus tests demo mock-voltage grafana
          ruff format --check keycensus tests demo mock-voltage grafana
      - name: Pytest
        env:
          KEYCENSUS_REQUIRE_SLAPD: "1"   # the StartTLS tests must run here, not skip
        run: python -m pytest -q

  helm-chart:
    name: helm lint + template (serve and scan modes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint helm/keycensus
      - run: helm lint helm/keycensus -f helm/keycensus/ci/scan-values.yaml
      - run: helm template t helm/keycensus --kube-version 1.29.0 > /dev/null
      - run: helm template t helm/keycensus --kube-version 1.29.0 -f helm/keycensus/ci/scan-values.yaml > /dev/null
      - run: helm template t helm/keycensus --kube-version 1.29.0 --set rbac.kubernetesSource=true > /dev/null

  prometheus-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          docker run --rm -v "$PWD/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /p/alerts/keycensus.rules.yml
          docker run --rm -v "$PWD/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v3.5.0 check config /p/prometheus.yml

  compose-smoke:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Boot the stack
        run: docker compose up -d --build
      - name: Wait for the first scan
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9742/healthz >/dev/null; then echo ready; break; fi
            sleep 3
          done
          curl -sf http://localhost:9742/healthz
      - name: Every demo source scanned OK
        run: |
          curl -sf http://localhost:9742/inventory.json > inv.json
          python3 - <<'EOF'
          import json, sys
          inv = json.load(open("inv.json"))
          bad = [s for s in inv["sources"] if s["error"]]
          print(json.dumps(inv["summary"], indent=2))
          for s in inv["sources"]: print(s["name"], s["type"], s["assets"], s["error"] or "ok")
          assert not bad, f"sources failed: {bad}"
          partial = [s["name"] for s in inv["sources"] if s.get("status") != "complete"]
          assert not partial, f"sources not complete: {partial}"
          assert inv["summary"]["assets"] >= 30
          assert inv["summary"]["findings_by_severity"]["critical"] >= 1
          EOF
      - name: CBOM is served and metrics exist
        run: |
          curl -sf http://localhost:9742/cbom.json | python3 -c "import json,sys; b=json.load(sys.stdin); assert b['specVersion']=='1.6' and b['components']"
          curl -sf http://localhost:9742/metrics | grep -q '^keycensus_findings_by_severity'
          curl -sf http://localhost:9742/metrics | grep -q '^keycensus_source_complete{.*} 2.0'
      - name: doctor finds nothing to fix in the demo
        run: docker exec keycensus keycensus doctor -c /config/keycensus.yml
      - name: doctor names the Vault grant a narrower token lacks
        run: |
          sed '/^path "pki\/certs"/d' deploy/vault/keycensus-policy.hcl > narrow.hcl
          docker cp narrow.hcl vault:/tmp/narrow.hcl
          V="docker exec -e VAULT_ADDR=http://127.0.0.1:8200 -e VAULT_TOKEN=root vault vault"
          $V policy write kc-narrow /tmp/narrow.hcl
          T=$($V token create -policy=kc-narrow -field=token)
          rc=0
          docker exec -e VAULT_TOKEN="$T" keycensus keycensus doctor -c /config/keycensus.yml -s vault --json \
            > doctor.json || rc=$?
          cat doctor.json
          test "$rc" = 6
          python3 - <<'EOF'
          import json
          d = json.load(open("doctor.json"))["sources"][0]
          gaps = [p for p in d["problems"] if p["level"] == "gap"]
          assert [(g["scope"], g["kind"], g["items"]) for g in gaps] == [("mounts", "denied", ["pki"])], gaps
          assert gaps[0]["fix"]["file"] == "deploy/vault/keycensus-policy.hcl"
          assert d["assets"] >= 7, d
          EOF
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  dependency-track:
    # A CBOM with applications, relationships and findings, uploaded with `keycensus upload dtrack` into
    # a fresh Dependency-Track, exported back and compared. 4.14 has no type for cryptographic assets, so
    # that row checks the import is refused rather than half done; it does not block the build.
    name: Dependency-Track ${{ matrix.dt }} round-trip (CycloneDX ${{ matrix.cbom }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.expect == 'rejected' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dt: "5.1.2", cbom: "1.7", expect: roundtrip }
          - { dt: "5.1.2", cbom: "1.6", expect: roundtrip }
          - { dt: "4.14.6", cbom: "1.6", expect: rejected }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Start Dependency-Track
        env:
          DT: ${{ matrix.dt }}
        run: |
          if [[ "$DT" == 5.* ]]; then
            docker network create dt
            docker run -d --name dt-db --network dt -e POSTGRES_DB=dtrack -e POSTGRES_USER=dtrack \
              -e POSTGRES_PASSWORD=dtrack postgres:18-alpine
            until docker exec dt-db pg_isready -U dtrack -d dtrack; do sleep 2; done
            docker run -d --name dt --network dt -p 8080:8080 \
              -e DT_DATASOURCE_URL=jdbc:postgresql://dt-db:5432/dtrack \
              -e DT_DATASOURCE_USERNAME=dtrack -e DT_DATASOURCE_PASSWORD=dtrack \
              -e DT_TELEMETRY_SUBMISSION_DEFAULT_ENABLED=false \
              "ghcr.io/dependencytrack/apiserver:$DT"
          else
            docker run -d --name dt -p 8080:8080 "dependencytrack/apiserver:$DT"
          fi
      - name: Install
        run: pip install -e ".[test]"
      - name: Build a linked CBOM (certificates, keys, two applications, findings)
        env:
          CBOM: ${{ matrix.cbom }}
        run: |
          python demo/make_demo_certs.py "$RUNNER_TEMP/certs"
          cat > "$RUNNER_TEMP/dt.yml" <<EOF
          sources:
            - name: certs
              type: pem
              paths: ["$RUNNER_TEMP/certs"]
          applications:
            - sbom: $GITHUB_WORKSPACE/demo/sboms/payments-api.cdx.json
              uses: [{source: certs}]
            - name: auth-service
              uses: [{source: certs, algorithm: EC}]
          EOF
          keycensus scan -c "$RUNNER_TEMP/dt.yml" -o out -f cbom -f json --cbom-version "$CBOM"
      - name: Round-trip through Dependency-Track
        env:
          EXPECT: ${{ matrix.expect }}
        run: |
          python tests/integration/dtrack_roundtrip.py --url http://localhost:8080 --cbom out/cbom.json \
            --expect "$EXPECT" --summary "$GITHUB_STEP_SUMMARY" --report dtrack-report.json
      - name: Keep the comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dtrack-${{ matrix.dt }}-cdx-${{ matrix.cbom }}
          path: |
            dtrack-report.json
            out/cbom.json
          if-no-files-found: ignore
      - name: Dependency-Track log on failure
        if: failure()
        run: docker logs dt 2>&1 | tail -300

  publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless signing (Sigstore) and attestations use the workflow's OIDC identity
      attestations: write
    needs: [test, prometheus-rules, compose-smoke, helm-chart]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      # ---- signed releases: signature, SBOM and build provenance, all bound to the image digest
      - name: Lowercase image name (registries reject upper case)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless, recorded in the Rekor transparency log)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
          cosign sign --yes "$image"
      - name: SBOM of the image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: keycensus-image.spdx.json
          upload-artifact: true
      - name: Attach the SBOM as a signed attestation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes --type spdxjson --predicate keycensus-image.spdx.json \
            "ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
      - name: Build provenance attestation (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
