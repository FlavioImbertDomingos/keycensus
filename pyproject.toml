[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "keycensus"
version = "0.21.0"
description = "Cryptographic inventory (CBOM) and key-hygiene scanner for HSMs, KMSs, Vault, AD CS, certificates, TLS and SSH endpoints, with network and cloud discovery"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Flavio Domingos" }]
keywords = ["cbom", "cyclonedx", "ssh", "network-discovery", "ml-kem", "cryptography", "inventory", "pci-dss", "pqc", "hsm", "kms", "vault", "azure", "gcp", "ciphertrust", "nshield", "adcs", "active-directory", "pki", "dependency-track"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Security :: Cryptography",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "click>=8.1",
  "PyYAML>=6.0",
  "cryptography>=50.0.1",
  "jinja2>=3.1",
  "requests>=2.31",
  "asn1crypto>=1.5",
  "prometheus-client>=0.20",
]

[project.urls]
Homepage = "https://github.com/FlavioImbertDomingos/keycensus"
Documentation = "https://github.com/FlavioImbertDomingos/keycensus/tree/main/docs"
Changelog = "https://github.com/FlavioImbertDomingos/keycensus/blob/main/CHANGELOG.md"
Issues = "https://github.com/FlavioImbertDomingos/keycensus/issues"

[project.optional-dependencies]
pkcs11 = ["python-pkcs11>=0.7"]
vault = ["hvac>=2.1"]
aws = ["boto3>=1.34"]
azure = ["azure-identity>=1.17"]
gcp = ["google-auth>=2.30"]
adcs = ["ldap3>=2.9"]
adcs-kerberos = ["ldap3>=2.9", "gssapi>=1.8"]
kubernetes = ["kubernetes>=29"]
all = ["python-pkcs11>=0.7", "hvac>=2.1", "boto3>=1.34", "azure-identity>=1.17", "google-auth>=2.30", "ldap3>=2.9", "kubernetes>=29"]
test = ["pytest>=8", "responses>=0.25", "jsonschema>=4.21", "moto[kms]>=5", "hvac>=2.1", "boto3>=1.34", "python-pkcs11>=0.7", "ldap3>=2.9", "kubernetes>=29"]

[project.scripts]
keycensus = "keycensus.cli:main"

[tool.setuptools.packages.find]
include = ["keycensus*"]

[tool.setuptools.package-data]
keycensus = ["templates/*.html", "data/*.yml", "data/policies/*.yml", "data/cyclonedx/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
