{{- if and .Values.mode.serve.enabled .Values.mode.serve.auth.generateToken (not .Values.mode.serve.auth.existingTokenSecret) }}
{{- $name := printf "%s-serve-token" (include "keycensus.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "keycensus.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (index $existing.data .Values.mode.serve.auth.tokenSecretKey) }}
  {{ .Values.mode.serve.auth.tokenSecretKey }}: {{ index $existing.data .Values.mode.serve.auth.tokenSecretKey }}
  {{- else }}
  {{ .Values.mode.serve.auth.tokenSecretKey }}: {{ randAlphaNum 40 | b64enc }}
  {{- end }}
{{- end }}
