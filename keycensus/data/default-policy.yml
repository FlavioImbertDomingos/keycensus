# keycensus default policy.
#
# Copy this file, change the numbers, and pass it with `--policy my-policy.yml`.
# Every rule can be turned off with `enabled: false` or re-graded with `severity:`.
#
# Defaults are conservative readings of PCI DSS v4.0.1 "strong cryptography",
# NIST SP 800-57 cryptoperiods and NIST SP 800-131A / IR 8547 (final, Oct 2026) transitions.

name: default

# How long a key may be used before it must be rotated (days).
# NIST SP 800-57 Pt.1 Table 1 suggests <= 2 years for symmetric data-encryption
# keys and 1-3 years for private signature keys; many PCI programmes use 1 year.
cryptoperiod_days:
  default: 365
  by_algorithm:
    AES: 365
    ChaCha20: 365
    HMAC: 365
    RSA: 730
    EC: 730
    Ed25519: 730
  by_purpose:        # purpose beats algorithm when both match
    wrap: 1095       # key-encrypting keys typically live longer
    sign: 730

certificate:
  expiring_soon_days: 30
  expiring_critical_days: 7
  max_validity_days: 398   # CA/B Forum limit for public TLS; longer = flag (info)

rules:
  weak-algorithm:            {enabled: true, severity: high}
  weak-key-size:             {enabled: true, severity: high}
  deprecated-signature-hash: {enabled: true, severity: high}
  rotation-overdue:          {enabled: true, severity: medium}
  rotation-disabled:         {enabled: true, severity: low}
  no-creation-date:          {enabled: true, severity: info}
  cert-expired:              {enabled: true, severity: critical}
  cert-expiring-critical:    {enabled: true, severity: high}
  cert-expiring-soon:        {enabled: true, severity: medium}
  cert-self-signed:          {enabled: true, severity: info}
  cert-long-validity:        {enabled: true, severity: info}
  key-exportable:            {enabled: true, severity: medium}
  key-software-backed:       {enabled: true, severity: low}
  key-not-active:            {enabled: true, severity: info}
  quantum-vulnerable:        {enabled: true, severity: low}
  quantum-vulnerable-encryption: {enabled: true, severity: medium}  # harvest-now-decrypt-later
  quantum-reduced:           {enabled: true, severity: info}   # margin note: NIST keeps AES-128/192
  tls-weak-protocol:         {enabled: true, severity: high}
  tls-weak-cipher:           {enabled: true, severity: high}
  tls-no-forward-secrecy:    {enabled: true, severity: low}
  quantum-vulnerable-key-exchange: {enabled: true, severity: medium}  # TLS / SSH: harvest-now-decrypt-later
  hybrid-key-exchange:       {enabled: true, severity: info}   # allowed by NIST IR 8547, but temporary
  ssh-weak-algorithm:        {enabled: true, severity: high}
  unknown-algorithm:         {enabled: true, severity: info}
  adcs-template-weak-key-size: {enabled: true, severity: medium}  # AD CS template permits weak keys
  hardcoded-private-key:     {enabled: true, severity: critical} # code: a private key or keystore in the tree
  weak-hash:                 {enabled: true, severity: medium}   # code: MD5 / SHA-1 calls
  weak-cipher-mode:          {enabled: true, severity: high}     # code: ECB (incl. Java's Cipher.getInstance("AES"))
  keystore-weak-protection:  {enabled: true, severity: medium}   # JKS/JCEKS, legacy PKCS#12, default passwords
  ct-unexpected-issuer:      {enabled: true, severity: high}     # CT: a public certificate from a CA you did not list
  ldap-cleartext:            {enabled: true, severity: medium}   # network: LDAP on 389 that refuses StartTLS
  key-reuse-on-renewal:      {enabled: true, severity: low}      # cert-manager rotationPolicy: Never
  unlinked-asset:            {enabled: true, severity: info}   # only evaluated when `applications:` are declared

# Sources that are hardware-backed by definition (used when a collector cannot tell).
# Anything else with hardware_backed == false and a protective purpose gets key-software-backed.
